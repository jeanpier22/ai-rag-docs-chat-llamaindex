apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: servicio-rag-fastapi
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "1"   # una sola instancia: el documento vive en memoria
    spec:
      containers:
        - image: us-central1-docker.pkg.dev/rag-llamaindex-fastapi-nextjs/repo-rag-fastapi/image-rag-fastapi:v3
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: OPENAI_API_KEY   # nombre del secreto en Secret Manager
                  key: latest            # versión del secreto
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: RAG_API_KEY
                  key: latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
